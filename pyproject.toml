[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "Direct_AMD_Train"
version = "2.0.0.dev0"
description = "让 PyTorch / ultralytics 在 AMD 显卡（DirectML / DirectX 12）上正常训练与调试：补齐后端算子差异 + 能力探测 + 数值对齐自检"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "羊羊羊" }]
keywords = ["directml", "amd", "directx12", "pytorch", "windows", "training", "inference", "ultralytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.0", "torch-directml>=0.2.5.dev240914", "ultralytics>=8.3"]
test = ["pytest>=7.0"]

[project.scripts]
direct-amd-train = "Direct_AMD_train.cli:main"

[tool.setuptools.packages.find]
include = ["Direct_AMD_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
