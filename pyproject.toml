[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "directml-amd-train"
version = "1.0.0"
description = "让 ultralytics YOLO 在 AMD 显卡（DirectML / DirectX 12）上正常训练"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "羊羊羊" }]
keywords = ["directml", "amd", "yolo", "ultralytics", "pytorch", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.0", "torch-directml>=0.2.5.dev240914", "ultralytics>=8.3"]
test = ["pytest>=7.0"]

[project.scripts]
directml-amd-train = "directml_amd_train.cli:main"

[tool.setuptools.packages.find]
include = ["directml_amd_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
